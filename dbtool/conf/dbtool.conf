# =============================================================================
# dbtool 設定ファイル (KEY=VALUE 形式。行頭 # はコメント)
#   相対パスは dbtool.sh のあるディレクトリを基準にします。
# =============================================================================

# ---- 接続 -------------------------------------------------------------------
# MySQL の接続設定ファイル (client.cnf.sample をコピーして作成し chmod 600 にしてください)
MYSQL_DEFAULTS_FILE=conf/client.cnf
# mysql_config_editor のログインパスを使う場合に指定 (例: aurora)
MYSQL_LOGIN_PATH=
# -d を省略したときのデータベース名
DEFAULT_DATABASE=

# 接続タイムアウト(秒) / 接続失敗時のリトライ回数 / リトライ間隔(秒)
#   Aurora Serverless v2 の自動一時停止 (0 ACU) からの再開待ちを考慮しています
CONNECT_TIMEOUT=30
CONNECT_RETRIES=3
CONNECT_RETRY_INTERVAL=10

# ---- 出力先 -------------------------------------------------------------------
# dump / export の出力先
BACKUP_DIR=backup
# prepare の実行記録・生成データ・一時ファイル
WORK_DIR=work
# ログ (dbtool_YYYYMMDD.log)
LOG_DIR=log

# ---- 動作 ---------------------------------------------------------------------
# mysql / mysqldump コマンド (PATH にない場合はフルパスで指定)
MYSQL_BIN=mysql
MYSQLDUMP_BIN=mysqldump
# DELETE の1回あたりの削除件数 (この件数ごとにコミット)
DELETE_BATCH_ROWS=10000
# dump の圧縮 (gzip / none)
DUMP_COMPRESS=gzip

# ---- 安全対策 -------------------------------------------------------------------
# 更新系コマンド (restore/import/load/truncate/delete/prepare/cleanup) を許可する
# データベース名の正規表現。空の場合は制限なし。
#   例: 本番を守るため検証用DBだけ許可  ALLOWED_DATABASE_REGEX=^(perf|stg)_
ALLOWED_DATABASE_REGEX=
